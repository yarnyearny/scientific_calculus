[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-calculus"
version = "0.1.0"
description = "面隣接グラフ上の共有経路を近似最適化するソルバー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
steiner-connect = "scientific_calculus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
