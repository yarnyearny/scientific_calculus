[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l1-voronoi-grid"
version = "0.1.0"
description = "Grid-based L1 Voronoi subdivision with axis-aligned segment obstacles"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
